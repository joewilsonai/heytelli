kind = "web"
previewPath = "/"
title = "Bumble Reply Generator"
version = "1.0.0"
id = "artifacts/bumble-reply"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24965

[services.development]
run = "pnpm --filter @workspace/bumble-reply run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bumble-reply", "run", "build" ]
publicDir = "artifacts/bumble-reply/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24965"
BASE_PATH = "/"
