<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="HeyTelli icon">
  <!-- Tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="#2E2632"/>

  <!-- Speech bubble: terracotta outline via knockout -->
  <!-- outer terracotta body -->
  <rect x="212" y="300" width="600" height="340" rx="96" fill="#D9694C"/>
  <!-- tail (terracotta) -->
  <path d="M360 612 L470 612 L360 782 Z" fill="#D9694C"/>
  <!-- inner plum knockout -> leaves a ~40px terracotta outline -->
  <rect x="252" y="340" width="520" height="260" rx="60" fill="#2E2632"/>

  <!-- Chat lines (cream), tapering -->
  <rect x="300" y="398" width="360" height="34" rx="17" fill="#FAF7F3"/>
  <rect x="300" y="462" width="320" height="34" rx="17" fill="#FAF7F3"/>
  <rect x="300" y="526" width="240" height="34" rx="17" fill="#FAF7F3"/>

  <!-- 4-point sparkle, top-right inside bubble -->
  <path d="M722 352
           Q734 386 768 398
           Q734 410 722 444
           Q710 410 676 398
           Q710 386 722 352 Z"
        fill="#D9694C"/>
</svg>
