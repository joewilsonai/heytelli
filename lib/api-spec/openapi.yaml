openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: matches
    description: Bumble CRM matches
  - name: storage
    description: Object storage upload and serving endpoints
  - name: openrouter
    description: OpenRouter AI chat operations (Grok-powered match chatbot)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a match from an initial screenshot
      description: |
        Creates a new match record from an uploaded screenshot. The server
        runs vision extraction on the screenshot to suggest a name and
        initial profile. The screenshot is appended to the match's conversation log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchCreateInput"
      responses:
        "201":
          description: Match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/preview:
    post:
      operationId: previewMatchExtraction
      tags: [matches]
      summary: Run vision extraction on an uploaded screenshot without persisting a match
      description: |
        Given the object path of an already-uploaded screenshot, runs the AI
        vision model and returns the suggested name, vibe tags, and extracted
        profile so the user can review and edit before the match is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotInput"
      responses:
        "200":
          description: Extraction preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionPreview"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get a match with its screenshots
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update a match's editable fields
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/screenshots:
    get:
      operationId: listScreenshots
      tags: [matches]
      summary: List all screenshots for a match in chronological order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Screenshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Screenshot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: addScreenshot
      tags: [matches]
      summary: Add a screenshot to a match and update the extracted profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenshotInput"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/rescore:
    post:
      operationId: rescoreMatch
      tags: [matches]
      summary: Re-run AI extraction on the latest screenshot to refresh scores
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Match with refreshed extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "400":
          description: No screenshots to score from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/date-brief:
    post:
      operationId: generateDateBrief
      tags: [matches]
      summary: Generate a pre-date prep brief from Grok using full match context
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Date brief markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateBriefResult"
        "400":
          description: No upcoming date scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/red-flags:
    get:
      operationId: getRedFlagRadar
      tags: [matches]
      summary: Analyze conversation and date history for behavioral red/green flags
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Red flag radar result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedFlagRadarResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/cheat-sheet:
    get:
      operationId: getCheatSheet
      tags: [matches]
      summary: Get 3 quick-reply suggestions (playful / curious / direct) for current chat state
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cheat sheet replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheatSheetResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/tag-suggestions:
    get:
      operationId: getTagSuggestions
      tags: [matches]
      summary: AI-proposed tag adds/removes based on latest match context
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestionResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/tag-history:
    get:
      operationId: getTagHistory
      tags: [matches]
      summary: Chronological log of every tag add/remove on this match
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tag history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagHistoryResult"
  /matches/{id}/tags/apply:
    post:
      operationId: applyTagSuggestions
      tags: [matches]
      summary: Apply AI tag suggestions, persisting the diff as events
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagSuggestionApplyInput"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/response-stats:
    get:
      operationId: getResponseStats
      tags: [matches]
      summary: Compute her vs. user reply cadence from screenshot history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Response cadence stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseStats"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/weekly-debrief:
    get:
      operationId: getWeeklyDebrief
      tags: [matches]
      summary: Cross-match weekly Sunday debrief for the entire active pipeline
      responses:
        "200":
          description: Weekly debrief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyDebriefResult"
  /matches/auto-archive-candidates:
    get:
      operationId: getAutoArchiveCandidates
      tags: [matches]
      summary: List active matches that have gone fully cold and are candidates to archive/ghost
      responses:
        "200":
          description: Auto-archive candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutoArchiveCandidate"
  /analytics/funnel:
    get:
      operationId: getFunnelStats
      tags: [matches]
      summary: Conversion funnel and pipeline analytics
      responses:
        "200":
          description: Funnel stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelStats"
  /matches/stale-nudges:
    get:
      operationId: getStaleNudges
      tags: [matches]
      summary: List matches that have gone quiet with AI-generated re-engagement openers
      description: |
        Returns active matches where the last speaker was her or unknown AND
        her last reply was more than 36 hours ago. For each, includes 3
        suggested openers tailored to the conversation.
      responses:
        "200":
          description: List of stale matches with openers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaleNudge"
  /matches/{id}/voice-note-feedback:
    post:
      operationId: voiceNoteFeedback
      tags: [matches]
      summary: Critique a voice note the user is about to send to a match
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceDebriefInput"
      responses:
        "200":
          description: Voice note feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceNoteFeedbackResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/in-person-recording:
    post:
      operationId: inPersonRecording
      tags: [matches]
      summary: Transcribe and analyze an in-person date recording (requires consent)
      description: |
        Transcribes an audio recording of an in-person interaction and runs
        the same debrief analysis. Requires `bothPartiesConsented=true` —
        the client is responsible for collecting that consent on-camera.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InPersonRecordingInput"
      responses:
        "200":
          description: Recording analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceDebriefResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/voice-debrief:
    post:
      operationId: voiceDebrief
      tags: [matches]
      summary: Transcribe a voice debrief audio recording and analyze it
      description: |
        Accepts an already-uploaded audio file (object path), transcribes it
        via Whisper, then asks the LLM to extract structured insights:
        summary, vibe, green/red flags, suggested next move, and revised
        scores. Server persists the transcript appended to match notes and
        applies revised scores.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceDebriefInput"
      responses:
        "200":
          description: Debrief analysis with the updated match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceDebriefResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /matches/{id}/replies:
    post:
      operationId: generateMatchReplies
      tags: [matches]
      summary: Generate 3 reply suggestions using full conversation history and extracted profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reply suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /openrouter/conversations:
    get:
      operationId: listOpenrouterConversations
      tags: [openrouter]
      summary: List all chat conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenrouterConversation"
    post:
      operationId: createOpenrouterConversation
      tags: [openrouter]
      summary: Create a new chat conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenrouterConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenrouterConversation"
  /openrouter/conversations/{id}:
    get:
      operationId: getOpenrouterConversation
      tags: [openrouter]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenrouterConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteOpenrouterConversation
      tags: [openrouter]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /openrouter/conversations/{id}/messages:
    get:
      operationId: listOpenrouterMessages
      tags: [openrouter]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenrouterMessage"
    post:
      operationId: sendOpenrouterMessage
      tags: [openrouter]
      summary: Send a message and stream the AI response (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenrouterMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    MatchScore:
      type: object
      required: [value, rationale]
      properties:
        value:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 10
            - type: "null"
        rationale: { type: ["string", "null"] }
    MatchScores:
      type: object
      required: [sexPotential, conversionAbility, chemistry]
      properties:
        sexPotential:
          $ref: "#/components/schemas/MatchScore"
        conversionAbility:
          $ref: "#/components/schemas/MatchScore"
        chemistry:
          $ref: "#/components/schemas/MatchScore"
    ExtractedProfile:
      type: object
      required:
        [job, location, interests, mentionedTopics, conversationTone, scores]
      properties:
        job: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        interests:
          type: array
          items: { type: string }
        mentionedTopics:
          type: array
          items: { type: string }
        conversationTone: { type: ["string", "null"] }
        scores:
          $ref: "#/components/schemas/MatchScores"
    ScoreHistoryPoint:
      type: object
      required: [sexPotential, conversionAbility, chemistry, createdAt]
      properties:
        sexPotential: { type: ["integer", "null"], minimum: 0, maximum: 10 }
        conversionAbility:
          { type: ["integer", "null"], minimum: 0, maximum: 10 }
        chemistry: { type: ["integer", "null"], minimum: 0, maximum: 10 }
        createdAt: { type: string, format: date-time }
    DateHistoryEntry:
      type: object
      required: [id, when, location, recap, createdAt]
      properties:
        id: { type: string }
        when: { type: string, format: date-time }
        location: { type: string }
        recap: { type: string }
        createdAt: { type: string, format: date-time }
    MatchReadSnapshot:
      type: object
      required: [body, generatedAt, screenshotCountAt]
      properties:
        body:
          type: string
          description: Persisted latest AI read for this connection.
        generatedAt:
          type: string
          format: date-time
        screenshotCountAt:
          type: integer
          description: Successfully analyzed screenshot count at generation time.
    MatchReadFreshness:
      type: string
      enum: [current, stale, missing]
      description: |
        current = the persisted read reflects all analyzed screenshots.
        stale   = newer screenshots exist or some screenshots need analysis.
        missing = no read has ever been generated.
    MatchStatus:
      type: string
      enum: [active, archived, ghosted]
    Match:
      type: object
      required:
        - id
        - name
        - photoObjectPath
        - status
        - vibeTags
        - extractedProfile
        - notes
        - nextDateAt
        - nextDateLocation
        - dateHistory
        - tags
        - createdAt
        - updatedAt
        - pendingScreenshotCount
        - failedScreenshotCount
        - analysisFreshness
        - lastDateBrief
        - dateBriefFreshness
        - lastRead
        - readFreshness
        - redFlags
        - currentRedFlags
        - historicalRedFlags
        - redFlagSummary
      properties:
        id: { type: integer }
        name: { type: string }
        photoObjectPath: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/MatchStatus"
        vibeTags:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        extractedProfile:
          $ref: "#/components/schemas/ExtractedProfile"
        notes: { type: string }
        nextDateAt: { type: ["string", "null"], format: date-time }
        nextDateLocation: { type: ["string", "null"] }
        nextDateOutfit: { type: ["string", "null"] }
        dateHistory:
          type: array
          items:
            $ref: "#/components/schemas/DateHistoryEntry"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastDateBrief:
          oneOf:
            - $ref: "#/components/schemas/DateBriefSnapshot"
            - type: "null"
        dateBriefFreshness:
          $ref: "#/components/schemas/DateBriefFreshness"
        lastRead:
          oneOf:
            - $ref: "#/components/schemas/MatchReadSnapshot"
            - type: "null"
        readFreshness:
          $ref: "#/components/schemas/MatchReadFreshness"
        redFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        currentRedFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        historicalRedFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        redFlagSummary:
          $ref: "#/components/schemas/RedFlagSummary"
        scoreHistory:
          type: array
          items:
            $ref: "#/components/schemas/ScoreHistoryPoint"
        lastSpeaker:
          type: ["string", "null"]
          enum: [her, me, null]
          description: Speaker of the most recent transcript turn, if any
        lastActivityAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of most recent screenshot upload (or null if none)
        pendingScreenshotCount:
          type: integer
          description: Screenshots awaiting analysis
        failedScreenshotCount:
          type: integer
          description: Screenshots whose analysis failed
        analysisFreshness:
          type: string
          enum: [current, needs-analysis, never-analyzed]
          description: Whether stored transcript reflects all screenshots
    Screenshot:
      type: object
      required:
        [
          id,
          matchId,
          objectPath,
          uploadedAt,
          extractionStatus,
          extractionError,
          rawImagePurgedAt,
        ]
      properties:
        id: { type: integer }
        matchId: { type: integer }
        objectPath: { type: ["string", "null"] }
        uploadedAt: { type: string, format: date-time }
        extractionStatus:
          type: string
          enum: [pending, done, failed]
        extractionError: { type: ["string", "null"] }
        rawImagePurgedAt: { type: ["string", "null"], format: date-time }
    TranscriptTurn:
      type: object
      required: [speaker, text]
      properties:
        speaker:
          type: string
          enum: [her, me]
        text: { type: string }
    MatchDetail:
      type: object
      required:
        - id
        - name
        - photoObjectPath
        - status
        - vibeTags
        - extractedProfile
        - notes
        - nextDateAt
        - nextDateLocation
        - dateHistory
        - transcript
        - tags
        - createdAt
        - updatedAt
        - screenshots
        - pendingScreenshotCount
        - failedScreenshotCount
        - analysisFreshness
        - lastDateBrief
        - dateBriefFreshness
        - lastRead
        - readFreshness
        - redFlags
        - currentRedFlags
        - historicalRedFlags
        - redFlagSummary
      properties:
        id: { type: integer }
        name: { type: string }
        photoObjectPath: { type: ["string", "null"] }
        status:
          $ref: "#/components/schemas/MatchStatus"
        vibeTags:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        extractedProfile:
          $ref: "#/components/schemas/ExtractedProfile"
        notes: { type: string }
        nextDateAt: { type: ["string", "null"], format: date-time }
        nextDateLocation: { type: ["string", "null"] }
        nextDateOutfit: { type: ["string", "null"] }
        dateHistory:
          type: array
          items:
            $ref: "#/components/schemas/DateHistoryEntry"
        lastDateBrief:
          oneOf:
            - $ref: "#/components/schemas/DateBriefSnapshot"
            - type: "null"
        dateBriefFreshness:
          $ref: "#/components/schemas/DateBriefFreshness"
        lastRead:
          oneOf:
            - $ref: "#/components/schemas/MatchReadSnapshot"
            - type: "null"
        readFreshness:
          $ref: "#/components/schemas/MatchReadFreshness"
        redFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        currentRedFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        historicalRedFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        redFlagSummary:
          $ref: "#/components/schemas/RedFlagSummary"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTurn"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        screenshots:
          type: array
          items:
            $ref: "#/components/schemas/Screenshot"
        pendingScreenshotCount:
          type: integer
          description: Screenshots awaiting analysis
        failedScreenshotCount:
          type: integer
          description: Screenshots whose analysis failed
        analysisFreshness:
          type: string
          enum: [current, needs-analysis, never-analyzed]
          description: Whether stored transcript reflects all screenshots
    MatchCreateInput:
      type: object
      required: [screenshotObjectPath]
      properties:
        screenshotObjectPath:
          type: string
          description: Object path returned from /storage/uploads/request-url after upload
        name:
          type: string
          description: Optional initial name. If omitted, the server uses a placeholder until extraction completes.
    ExtractionPreview:
      type: object
      required: [suggestedName, vibeTags, extractedProfile]
      properties:
        suggestedName: { type: ["string", "null"] }
        vibeTags:
          type: array
          items: { type: string }
        extractedProfile:
          $ref: "#/components/schemas/ExtractedProfile"
    MatchUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        notes: { type: string }
        status:
          $ref: "#/components/schemas/MatchStatus"
        vibeTags:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        extractedProfile:
          $ref: "#/components/schemas/ExtractedProfile"
        photoObjectPath: { type: ["string", "null"] }
        nextDateAt: { type: ["string", "null"], format: date-time }
        nextDateLocation: { type: ["string", "null"] }
        nextDateOutfit: { type: ["string", "null"] }
        dateHistory:
          type: array
          items:
            $ref: "#/components/schemas/DateHistoryEntry"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTurn"
    ScreenshotInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }
    VoiceDebriefInput:
      type: object
      required: [audioObjectPath]
      properties:
        audioObjectPath: { type: string }
        addToDateHistory:
          type: boolean
          description: If true, append a new date history entry summarizing this debrief.
    VoiceDebriefAnalysis:
      type: object
      required:
        - summary
        - vibe
        - greenFlags
        - redFlags
        - nextMoveSuggestion
        - scoreSuggestions
      properties:
        summary: { type: string }
        vibe: { type: ["string", "null"] }
        greenFlags:
          type: array
          items: { type: string }
        redFlags:
          type: array
          items: { type: string }
        nextMoveSuggestion: { type: ["string", "null"] }
        scoreSuggestions:
          $ref: "#/components/schemas/MatchScores"
    StaleNudge:
      type: object
      required: [matchId, name, photoObjectPath, hoursSinceLastReply, openers]
      properties:
        matchId: { type: integer }
        name: { type: string }
        photoObjectPath: { type: ["string", "null"] }
        hoursSinceLastReply: { type: number }
        openers:
          type: array
          items: { type: string }
    VoiceNoteFeedbackResult:
      type: object
      required:
        - transcript
        - toneRating
        - energyRating
        - strengths
        - improvements
        - rewrite
        - shouldSend
      properties:
        transcript: { type: string }
        toneRating: { type: ["integer", "null"] }
        energyRating: { type: ["integer", "null"] }
        strengths:
          type: array
          items: { type: string }
        improvements:
          type: array
          items: { type: string }
        rewrite: { type: ["string", "null"] }
        shouldSend:
          type: string
          enum: [send, revise, scrap]
    InPersonRecordingInput:
      type: object
      required: [audioObjectPath, bothPartiesConsented]
      properties:
        audioObjectPath: { type: string }
        bothPartiesConsented:
          type: boolean
          description: Must be true. Server rejects the request otherwise.
        addToDateHistory: { type: boolean }
    VoiceDebriefResult:
      type: object
      required: [transcript, analysis, match]
      properties:
        transcript: { type: string }
        analysis:
          $ref: "#/components/schemas/VoiceDebriefAnalysis"
        match:
          $ref: "#/components/schemas/MatchDetail"
    ReplyResult:
      type: object
      required: [replies]
      properties:
        replies:
          type: array
          items: { type: string }
    DateBriefResult:
      type: object
      required: [brief, generatedAt]
      properties:
        brief:
          { type: string, description: Markdown-formatted pre-date prep brief }
        generatedAt: { type: string, format: date-time }
    DateBriefSnapshot:
      type: object
      required: [brief, generatedAt, screenshotCountAt, contextHash]
      properties:
        brief: { type: string }
        generatedAt: { type: string, format: date-time }
        screenshotCountAt:
          type: integer
          description: Analyzed (extractionStatus=done) screenshot count at generation time
        contextHash:
          type: string
          description: Hash of date-related context (dateHistory, nextDate*, notes) at generation time
    DateBriefFreshness:
      type: string
      enum: [current, stale, missing]
      description: |
        current = brief is up to date.
        stale   = new analyzed screenshots, changed date details, or > 5 days old.
        missing = no brief has ever been generated.
    RedFlag:
      type: object
      required: [severity, label, evidence]
      properties:
        severity:
          type: string
          enum: [low, medium, high]
        label: { type: string }
        evidence: { type: string }
        status:
          type: string
          enum: [current, previously-seen]
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        occurrenceCount: { type: integer }
    GreenFlag:
      type: object
      required: [label, evidence]
      properties:
        label: { type: string }
        evidence: { type: string }
    RedFlagRadarResult:
      type: object
      required:
        - redFlags
        - currentRedFlags
        - historicalRedFlags
        - greenFlags
        - overallRead
        - generatedAt
        - redFlagSummary
      properties:
        redFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        currentRedFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        historicalRedFlags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }
        greenFlags:
          type: array
          items: { $ref: "#/components/schemas/GreenFlag" }
        overallRead: { type: string }
        generatedAt: { type: string, format: date-time }
        redFlagSummary:
          $ref: "#/components/schemas/RedFlagSummary"
    RedFlagSummary:
      type: object
      required:
        [currentCount, historicalCount, highSeverityCount, lastAnalyzedAt]
      properties:
        currentCount: { type: integer }
        historicalCount: { type: integer }
        highSeverityCount: { type: integer }
        lastAnalyzedAt: { type: ["string", "null"], format: date-time }
    CheatSheetReply:
      type: object
      required: [style, text]
      properties:
        style:
          type: string
          enum: [playful, curious, direct]
        text: { type: string }
    CheatSheetResult:
      type: object
      required: [replies]
      properties:
        replies:
          type: array
          items: { $ref: "#/components/schemas/CheatSheetReply" }
    ResponseStats:
