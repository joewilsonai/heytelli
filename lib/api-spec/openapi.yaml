        meAvgReplyHours: { type: ["number", "null"] }
        herMessageCount: { type: integer }
        meMessageCount: { type: integer }
        longestHerSilenceHours: { type: ["number", "null"] }
        cadenceBalance:
          type: string
          enum: [you_chasing, balanced, she_chasing, unknown]
    WeeklyDebriefMatchSummary:
      type: object
      required: [matchId, name, status, reason]
      properties:
        matchId: { type: integer }
        name: { type: string }
        status:
          type: string
          enum: [heating_up, cold, needs_attention, deprioritize, steady]
        reason: { type: string }
    WeeklyDebriefResult:
      type: object
