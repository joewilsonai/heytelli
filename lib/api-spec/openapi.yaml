openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bumble
    description: Bumble reply generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bumble-reply:
    post:
      operationId: generateBumbleReply
      tags: [bumble]
      summary: Generate reply suggestions from a Bumble screenshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BumbleScreenshotInput"
      responses:
        "200":
          description: Reply suggestions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BumbleReplyResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BumbleScreenshotInput:
      type: object
      properties:
        image:
          type: string
          description: Base64-encoded image of the Bumble conversation
      required:
        - image
    BumbleReplyResult:
      type: object
      properties:
        replies:
          type: array
          items:
            type: string
      required:
        - replies
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
