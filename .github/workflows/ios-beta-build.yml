name: iOS Beta Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to use.
        required: true
        default: beta
        type: choice
        options:
          - beta
          - development
          - production
      submit:
        description: Submit the completed build with the matching EAS submit profile.
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      message:
        description: Optional EAS build message.
        required: false
        type: string
      highlights:
        description: Optional in-app changelog highlights separated by ||, semicolons, or new lines.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "artifacts/bumble-mobile/**"
      - "lib/api-client-react/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: ios-beta-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS beta with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS_STATUS: 1
      EAS_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'beta' }}
      EAS_SUBMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.submit || 'false' }}
      EAS_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || '' }}
      HEYTELLI_CHANGELOG_HIGHLIGHTS: ${{ github.event_name == 'workflow_dispatch' && inputs.highlights || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Generate in-app build changelog
        env:
          HEYTELLI_EVENT_BEFORE: ${{ github.event.before }}
          HEYTELLI_EVENT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync, readFileSync } = require("node:fs");

          function clean(value, maxLength = 160) {
            return String(value || "")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, maxLength);
          }

          function gitSubjects(range) {
            try {
              return execFileSync("git", ["log", "--format=%s", "--no-merges", range], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "ignore"],
              })
                .split("\n")
                .map((line) => clean(line))
                .filter(Boolean);
            } catch {
              return [];
            }
          }

          function splitHighlights(value) {
            return String(value || "")
              .split(/\s*(?:\|\||\n|;)\s*/)
              .map((line) => clean(line))
              .filter(Boolean)
              .slice(0, 5);
          }

          const sha = process.env.HEYTELLI_EVENT_SHA || "";
          const before = process.env.HEYTELLI_EVENT_BEFORE || "";
          const zeroBefore = before && /^0+$/.test(before);
          const range = before && sha && !zeroBefore ? `${before}..${sha}` : "-1";
          const rangeSubjects = gitSubjects(range);
          const subjects = rangeSubjects.length > 0 ? rangeSubjects : gitSubjects("-1");
          const message = clean(
            process.env.EAS_MESSAGE || subjects[0] || `Beta build ${sha.slice(0, 7)}`,
            80,
          );
          const explicitHighlights = splitHighlights(process.env.HEYTELLI_CHANGELOG_HIGHLIGHTS);
          const highlights =
            explicitHighlights.length > 0
              ? explicitHighlights
              : subjects.length > 0
                ? subjects.slice(0, 5)
                : [message];
          const appJson = JSON.parse(readFileSync("artifacts/bumble-mobile/app.json", "utf8"));
          const version = clean(appJson.expo?.version || "1.0.0", 24);
          const date = new Date().toISOString().slice(0, 10);

          appendFileSync(
            process.env.GITHUB_ENV,
            [
              `EAS_MESSAGE=${message}`,
              `EXPO_PUBLIC_HEYTELLI_BUILD_CHANGELOG_VERSION=${version}`,
              `EXPO_PUBLIC_HEYTELLI_BUILD_CHANGELOG_DATE=${date}`,
              `EXPO_PUBLIC_HEYTELLI_BUILD_CHANGELOG_TITLE=${message}`,
              `EXPO_PUBLIC_HEYTELLI_BUILD_CHANGELOG_HIGHLIGHTS=${JSON.stringify(highlights)}`,
            ].join("\n") + "\n",
          );
          NODE

      - name: Check Expo token
        id: expo-token
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "::notice::EXPO_TOKEN is not configured. Skipping EAS build. Create an Expo access token and add it as the EXPO_TOKEN repository secret."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start EAS iOS build
        if: steps.expo-token.outputs.configured == 'true'
        working-directory: artifacts/bumble-mobile
        run: |
          args=(
            build
            --platform ios
            --profile "${EAS_PROFILE}"
            --non-interactive
            --message "${EAS_MESSAGE}"
          )

          if [[ "${EAS_SUBMIT}" == "true" ]]; then
            # `--what-to-test` is EAS Enterprise-only; keep TestFlight notes out
            # of auto-submit until we update App Store Connect directly.
            args+=(--auto-submit)
          fi

          pnpm dlx eas-cli@latest "${args[@]}"
