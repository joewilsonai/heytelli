name: Railway Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Railway service to deploy.
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - improvement-worker
  push:
    branches:
      - main
    paths:
      - ".github/workflows/railway-deploy.yml"
      - "artifacts/api-server/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "railway.json"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEYTELLI_API_BASE_URL: https://heytelli-api-production.up.railway.app
  RAILWAY_PROJECT_ID: 76fde7ef-f336-4a0d-902b-462d458f9a74
  RAILWAY_ENVIRONMENT: production
  RAILWAY_ENVIRONMENT_ID: a485ed4f-305f-4c2e-9d00-96c2229a2982
  RAILWAY_WORKER_SERVICE_ID: 6fd141a8-429f-4f8e-bc94-87faeb35bfaa

jobs:
  deploy-api:
    name: Deploy API
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      HEYTELLI_SMOKE_ADMIN_EMAIL: ${{ secrets.HEYTELLI_SMOKE_ADMIN_EMAIL }}
      HEYTELLI_SMOKE_INVITE_CODE: ${{ secrets.HEYTELLI_SMOKE_INVITE_CODE }}
      HEYTELLI_SMOKE_ADMIN_NAME: Railway Deploy Smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check deploy secrets
        run: |
          missing=0
          for name in RAILWAY_API_TOKEN HEYTELLI_SMOKE_ADMIN_EMAIL HEYTELLI_SMOKE_INVITE_CODE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the ${name} repository secret."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy heytelli-api to Railway
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --service heytelli-api \
            --environment "$RAILWAY_ENVIRONMENT" \
            --ci \
            --message "deploy heytelli-api ${GITHUB_SHA::7}"

      - name: Smoke test API routes
        run: node scripts/ci/railway-api-smoke.mjs

  deploy-improvement-worker:
    name: Deploy Improvement Worker
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'improvement-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check deploy secrets
        run: |
          if [[ -z "${RAILWAY_API_TOKEN}" ]]; then
            echo "::error::Set the RAILWAY_API_TOKEN repository secret."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy heytelli-improvement-worker to Railway
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --service heytelli-improvement-worker \
            --environment "$RAILWAY_ENVIRONMENT" \
            --detach \
            --message "deploy heytelli-improvement-worker ${GITHUB_SHA::7}"

      - name: Wait for worker build
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.RAILWAY_API_TOKEN;
          const expectedMessage = `deploy heytelli-improvement-worker ${process.env.GITHUB_SHA.slice(0, 7)}`;
          const input = {
            projectId: process.env.RAILWAY_PROJECT_ID,
            environmentId: process.env.RAILWAY_ENVIRONMENT_ID,
            serviceId: process.env.RAILWAY_WORKER_SERVICE_ID,
          };
          const query = `
            query LatestWorkerDeployment($input: DeploymentListInput!) {
              deployments(input: $input, first: 1) {
                edges {
                  node {
                    id
                    status
                    createdAt
                    meta
                  }
                }
              }
            }
          `;
          const terminalFailures = new Set(["FAILED", "CRASHED", "REMOVED"]);
          const deadline = Date.now() + 15 * 60 * 1000;

          while (Date.now() < deadline) {
            const response = await fetch("https://backboard.railway.com/graphql/v2", {
              method: "POST",
              headers: {
                authorization: `Bearer ${token}`,
                "content-type": "application/json",
              },
              body: JSON.stringify({ query, variables: { input } }),
            });
            const payload = await response.json();

            if (!response.ok || payload.errors) {
              throw new Error(
                `Railway deployment poll failed: ${JSON.stringify(payload.errors || payload)}`,
              );
            }

            const deployment = payload.data.deployments.edges[0]?.node;
            const status = deployment?.status || "UNKNOWN";
            const message = deployment?.meta?.cliMessage || "";
            console.log(`worker deployment ${deployment?.id || "unknown"}: ${status} (${message})`);

            if (message !== expectedMessage) {
              await new Promise((resolve) => setTimeout(resolve, 10_000));
              continue;
            }

            if (status === "SUCCESS") {
              process.exit(0);
            }
            if (terminalFailures.has(status)) {
              process.exit(1);
            }

            await new Promise((resolve) => setTimeout(resolve, 10_000));
          }

          throw new Error("Timed out waiting for heytelli-improvement-worker Railway deployment.");
          NODE
